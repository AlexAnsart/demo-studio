<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tasks</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101012;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #f2f2f0;
  }
  .card {
    width: 640px;
    background: #17171a;
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: #8b8b92;
    font-size: 14px;
  }
  .composer {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  #new-task-input {
    flex: 1;
    background: #0d0d0f;
    border: 1px solid #2f2f34;
    border-radius: 9px;
    padding: 12px 14px;
    font-size: 15px;
    color: #f2f2f0;
    outline: none;
  }
  #new-task-input:focus {
    border-color: #5b8def;
  }
  #add-btn {
    background: #5b8def;
    color: #0a0a0a;
    border: none;
    border-radius: 9px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #add-btn:active { transform: scale(0.98); }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0d0f;
    border: 1px solid #232327;
    border-radius: 9px;
    padding: 12px 14px;
    font-size: 15px;
    animation: rise 0.25s ease-out;
  }
  li.done { color: #6f6f76; text-decoration: line-through; }
  li .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5b8def;
    flex: none;
  }
  li.done .dot { background: #3a3a3f; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Tasks</h1>
    <p class="subtitle">A tiny fixture app — used to demo the demo-studio recording engine.</p>
    <div class="composer">
      <input id="new-task-input" type="text" placeholder="Add a task…" autocomplete="off" />
      <button id="add-btn">Add</button>
    </div>
    <ul id="list">
      <li><span class="dot"></span>Set up the project</li>
      <li class="done"><span class="dot"></span>Write the README</li>
    </ul>
  </div>

  <script>
    const input = document.getElementById('new-task-input')
    const btn = document.getElementById('add-btn')
    const list = document.getElementById('list')

    function addTask() {
      const text = input.value.trim()
      if (!text) return
      const li = document.createElement('li')
      li.innerHTML = `<span class="dot"></span>${text}`
      list.appendChild(li)
      input.value = ''
    }

    btn.addEventListener('click', addTask)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask()
    })
  </script>
</body>
</html>
